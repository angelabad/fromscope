<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fromscope</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <main class="mx-auto max-w-screen-2xl px-4 py-6 sm:px-6 lg:px-8">
    <header class="mb-4 flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="text-xl font-semibold tracking-tight text-slate-900">fromscope</h1>
        <p class="text-sm text-slate-500">Dockerfile base images by repository and branch</p>
      </div>
      <p id="count" class="text-sm text-slate-500">
        <span class="font-semibold text-slate-900 tabular-nums">{{len .Rows}}</span> rows
      </p>
    </header>

    <div class="max-h-[calc(100vh-8rem)] overflow-auto rounded-lg border border-slate-200 bg-white shadow-sm">
      <table class="min-w-full border-separate border-spacing-0 text-left text-sm">
        <thead class="sticky top-0 z-10 bg-slate-100 text-xs font-semibold uppercase tracking-wide text-slate-600">
          <tr>
            {{range .Columns}}<th scope="col" class="whitespace-nowrap border-b border-slate-200 px-3 py-2.5">{{.}}</th>{{end}}
          </tr>
        </thead>
        <tbody id="rows">
          {{template "rows.html" .}}
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
