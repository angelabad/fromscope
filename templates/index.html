<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fromscope</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <main class="mx-auto max-w-screen-2xl px-4 py-6 sm:px-6 lg:px-8">
    <form hx-get="/rows" hx-target="#rows" hx-trigger="input delay:300ms, submit" hx-sync="this:replace">
      <header class="mb-4 flex flex-wrap items-end justify-between gap-4">
        <div>
          <h1 class="text-xl font-semibold tracking-tight text-slate-900">fromscope</h1>
          <p class="text-sm text-slate-500">Dockerfile base images by repository and branch</p>
        </div>
        <div class="flex flex-wrap items-center gap-4">
          <input type="search" name="q" placeholder="Search all columns" aria-label="Search all columns" autocomplete="off"
                 class="w-72 rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm shadow-sm placeholder:text-slate-400 focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-500/20">
          <p id="count" class="text-sm text-slate-500">{{template "count.html" .}}</p>
        </div>
      </header>

      <div class="max-h-[calc(100vh-9rem)] overflow-auto rounded-lg border border-slate-200 bg-white shadow-sm">
        <table class="min-w-full border-separate border-spacing-0 text-left text-sm">
          <thead class="sticky top-0 z-10 bg-slate-100 text-xs font-semibold uppercase tracking-wide text-slate-600">
            <tr>
              {{range .Columns}}<th scope="col" class="whitespace-nowrap border-b border-slate-200 px-3 py-2.5">{{.}}</th>{{end}}
            </tr>
            <tr>
              {{range .Columns}}
              <td class="border-b border-slate-200 bg-white px-2 py-1.5 font-normal normal-case tracking-normal">
                {{- $values := index $.Options .}}
                {{- if $values}}
                <select name="{{.}}" aria-label="Filter {{.}}"
                        class="w-full min-w-28 rounded border border-slate-300 bg-white px-2 py-1 text-xs text-slate-700 focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-500/20">
                  <option value="">All</option>
                  {{range $values}}<option>{{.}}</option>{{end}}
                </select>
                {{- else}}
                <input type="search" name="{{.}}" placeholder="Filter…" aria-label="Filter {{.}}" autocomplete="off"
                       class="w-full min-w-28 rounded border border-slate-300 bg-white px-2 py-1 text-xs text-slate-700 placeholder:text-slate-400 focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-500/20">
                {{- end}}
              </td>
              {{end}}
            </tr>
          </thead>
          <tbody id="rows">
            {{template "rows.html" .}}
          </tbody>
        </table>
      </div>
    </form>
  </main>
</body>
</html>
