name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod   # single source of truth for the Go version

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15        # minor version; the action picks the latest patch
          install-only: true

      - name: go.mod is tidy
        run: make tidy-check

      - name: Verify modules
        run: make verify

      - name: Install Tailwind CSS
        env:
          TAILWIND_VERSION: v4.3.5   # keep in sync with the header of static/app.css
        run: |
          curl -sSfL -o "$RUNNER_TEMP/tailwindcss" \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64"
          chmod +x "$RUNNER_TEMP/tailwindcss"

      - name: CSS is up to date
        run: make css-check TAILWIND="$RUNNER_TEMP/tailwindcss"

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Vulnerabilities
        run: make vuln

      - name: Build
        run: make build
